<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cantabria Map</title>
<meta name="description" content="Personal map of places and activities in Cantabria and the Picos de Europa.">
<meta name="theme-color" content="#1f4d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cantabria">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="map" aria-label="Map of Cantabria"></div>

<div id="filters" role="group" aria-label="Layers"></div>

<div class="ctrl-stack">
  <button id="btn-base" class="ctrl" type="button" aria-label="Switch map style" title="Switch map style">🗺</button>
  <button id="btn-locate" class="ctrl" type="button" aria-label="Show my location" title="Show my location">◎</button>
</div>

<aside id="sheet" hidden aria-live="polite">
  <button id="sheet-close" type="button" aria-label="Close">×</button>
  <div id="sheet-body"></div>
</aside>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/app.js"></script>
</body>
</html>
