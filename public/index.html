<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cantabria Map</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Personal map of places and activities in Cantabria and the Picos de Europa.">
<meta name="theme-color" content="#1f4d3a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14201a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cantabria">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/style.css">
<script defer src="/vendor/leaflet/leaflet.js"></script>
<script defer src="/app.js"></script>
</head>
<body>
<h1 class="sr-only">Cantabria places map</h1>

<div id="topbar">
  <button id="btn-filters" class="chip" type="button" aria-expanded="false" aria-controls="fpanel"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>Filters<span class="badge" hidden></span></button>
  <div id="filters" role="group" aria-label="Layers"></div>
</div>

<div class="ctrl-stack">
  <button id="btn-base" class="ctrl" type="button" aria-label="Switch map style" title="Switch map style"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
  <button id="btn-legend" class="ctrl" type="button" aria-label="Show key" title="Key" aria-expanded="false" aria-controls="legend"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.9" r="1.2" fill="currentColor"/></svg></button>
  <button id="btn-locate" class="ctrl" type="button" aria-label="Show my location" title="Show my location"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>

<div id="legend" hidden></div>

<div id="fpanel" hidden><div id="fcount" aria-live="polite"></div></div>

<aside id="sheet" hidden role="dialog" aria-labelledby="sheet-title">
  <div id="sheet-grab" role="button" tabindex="0" aria-label="Expand or collapse details" aria-expanded="false" aria-controls="sheet-body"><i></i></div>
  <button id="sheet-close" type="button" aria-label="Close">×</button>
  <div id="sheet-body"></div>
</aside>

<div id="map" role="region" aria-label="Map of Cantabria"></div>
</body>
</html>
